<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Ícones do Corny: traço de 2px, cor herdada (currentColor). Uso: <svg><use href="/img/icons.svg#shears"/></svg> -->

  <!-- Tesoura de poda: a marca do jogo -->
  <symbol id="shears" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 9.5 21 3.5c-1.2 3.6-4.6 7.3-8.8 8.7"/>
    <path d="M9.5 14.5 21 20.5c-1.2-3.6-4.6-7.3-8.8-8.7"/>
    <circle cx="6" cy="7" r="3.2"/>
    <circle cx="6" cy="17" r="3.2"/>
    <circle cx="12" cy="12" r="0.6" fill="currentColor"/>
  </symbol>

  <!-- Broto: quem sobrevive -->
  <symbol id="sprout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21v-8"/>
    <path d="M12 13c0-4-3-6.5-8-6.5 0 4.2 3 6.5 8 6.5z"/>
    <path d="M12 11c0-3.6 2.6-6.5 8-6.5 0 4-2.8 6.5-8 6.5z"/>
    <path d="M7 21h10"/>
  </symbol>

  <!-- Folha (chuva de folhas do vencedor) -->
  <symbol id="leaf" viewBox="0 0 24 24">
    <path d="M4 20C4 10 10 4 21 3c-.6 10.6-6.6 17-17 17z" fill="currentColor"/>
    <path d="M4 20 15 9" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

  <!-- Espiga de milho: o "Corn" de Corny -->
  <symbol id="corn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5c3 0 4.5 3.2 4.5 7.5S15 18 12 18s-4.5-3.7-4.5-8S9 2.5 12 2.5z"/>
    <path d="M9 7.5h6M8.6 11h6.8M9.3 14.5h5.4M12 3v14.5"/>
    <path d="M7.5 10C5 12 4 15.5 5.5 21.5c2-1.4 4.4-2.8 6.5-3.5"/>
    <path d="M16.5 10c2.5 2 3.5 5.5 2 11.5-2-1.4-4.4-2.8-6.5-3.5"/>
  </symbol>

  <!-- Ramo de folhas da tela de vencedor (o da direita é espelhado no CSS) -->
  <symbol id="laurel" viewBox="0 0 24 48">
    <path d="M18 46C8 38 4 26 7 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="11" cy="8" rx="2.4" ry="5" transform="rotate(30 11 8)" fill="currentColor"/>
    <ellipse cx="3.6" cy="12" rx="2.4" ry="5" transform="rotate(-30 3.6 12)" fill="currentColor"/>
    <ellipse cx="11" cy="18" rx="2.4" ry="5" transform="rotate(40 11 18)" fill="currentColor"/>
    <ellipse cx="3.2" cy="22" rx="2.4" ry="5" transform="rotate(-40 3.2 22)" fill="currentColor"/>
    <ellipse cx="13" cy="28" rx="2.4" ry="5" transform="rotate(50 13 28)" fill="currentColor"/>
    <ellipse cx="5.6" cy="32.5" rx="2.4" ry="5" transform="rotate(-45 5.6 32.5)" fill="currentColor"/>
    <ellipse cx="16.5" cy="37" rx="2.2" ry="4.6" transform="rotate(60 16.5 37)" fill="currentColor"/>
  </symbol>

  <!-- Brilho de quatro pontas (explosão de quem é salvo, confete) -->
  <symbol id="sparkle" viewBox="0 0 24 24">
    <path d="M12 1.5c.9 5.4 3.1 7.6 8.5 8.5-5.4.9-7.6 3.1-8.5 8.5-.9-5.4-3.1-7.6-8.5-8.5 5.4-.9 7.6-3.1 8.5-8.5z" transform="translate(0 2)" fill="currentColor"/>
  </symbol>

  <symbol id="trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 4h10v5a5 5 0 0 1-10 0z"/>
    <path d="M7 6H4.5a3 3 0 0 0 3 4.2M17 6h2.5a3 3 0 0 1-3 4.2"/>
    <path d="M12 14v4M8 21h8M9.5 18h5"/>
  </symbol>

  <symbol id="logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 4h5v16h-5"/>
    <path d="M9 16l-4-4 4-4M5 12h10"/>
  </symbol>

  <symbol id="fullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
  </symbol>

  <symbol id="sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
    <path d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/>
  </symbol>

  <symbol id="sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
    <path d="M16 9.5l5 5M21 9.5l-5 5"/>
  </symbol>

  <symbol id="back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 18l-6-6 6-6"/>
  </symbol>

  <symbol id="close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M6 6l12 12M18 6 6 18"/>
  </symbol>

  <symbol id="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9S14.5 18.4 12 21c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z"/>
  </symbol>

  <symbol id="user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4.5 21c.6-4 3.6-6.5 7.5-6.5s6.9 2.5 7.5 6.5"/>
  </symbol>

  <symbol id="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>
  </symbol>

  <symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.5 15.5 21 21"/>
  </symbol>

  <symbol id="target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="8"/>
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/>
  </symbol>

  <symbol id="upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/>
  </symbol>
</svg>
